app:
  jwt:
    # Use a long random secret in production (min 256 bits for HS256)
    secret: ${JWT_SECRET:booking-cms-default-secret-key-min-256-bits-for-hs256}
    expiration-ms: ${JWT_EXPIRATION_MS:86400000}

spring:
  application:
    name: booking-cms
  datasource:
    url: jdbc:postgresql://localhost:5432/moviedb
    username: postgres
    password: 123456

  jpa:
    hibernate:
      ddl-auto: none
    show-sql: true

  flyway:
    enabled: true
    locations: classpath:db/migrations
    baseline-on-migrate: true
    clean-disabled: false
    clean-on-validation-error: true