# Logging: ensure console output is visible
logging:
  level:
    root: DEBUG
    com.demo.booking_cms: DEBUG
    org.springframework.web: INFO
    org.springframework.security: INFO
    org.hibernate.SQL: INFO
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} [%thread] [%X{userId}] %-5level %logger - %msg%n"

app:
  jwt:
    secret: ${JWT_SECRET:booking-cms-default-secret-key-min-256-bits-for-hs256}
    expiration-ms: ${JWT_EXPIRATION_MS:86400000}

spring:
  application:
    name: booking-cms
  datasource:
    url: jdbc:postgresql://localhost:5432/moviedb
    username: postgres
    password: 123456

  jpa:
    hibernate:
      ddl-auto: none
    show-sql: false

  flyway:
    enabled: true
    locations: classpath:db/migrations
    baseline-on-migrate: true
    clean-disabled: false
    clean-on-validation-error: true

go:
  api:
    base-url: http://localhost:8888/api/v1
    jwt-secret: ${GO_BOOKING_JWT_SECRET:Py+iM0RLDoelxAJ3SZxL5L1z7jujb2WFzT6WfLp08AY=}
    jwt-ttl-seconds: ${GO_BOOKING_JWT_TTL_SECONDS:3600}
    jwt-subject: ${GO_BOOKING_JWT_SUB:cms-gateway}

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      show-details: when_authorized
    prometheus:
      enabled: true
  metrics:
    tags:
      application: ${spring.application.name}
  tracing:
    sampling:
      probability: 1.0
  zipkin:
    tracing:
      endpoint: http://host.docker.internal:9411/api/v2/spans